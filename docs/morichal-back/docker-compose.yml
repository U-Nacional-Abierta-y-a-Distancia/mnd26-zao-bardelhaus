services:
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-api
    restart: always
    environment:
      - MODE=json-rpc
    ports:
      - "8081:8080"   # Spring usa el 8080, por eso Signal queda en el 8081
    volumes:
      - signal-data:/home/.local/share/signal-cli   # Conserva la cuenta vinculada entre reinicios

volumes:
  signal-data:
