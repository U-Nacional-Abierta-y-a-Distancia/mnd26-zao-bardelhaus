# Front de morichal (Angular estático en Nginx) en k3s, namespace "morichal".
# El pipeline reemplaza ${IMAGE} con envsubst. El backend ya ocupa /api; este Ingress toma todo lo demás (/).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: morichal-front
  namespace: morichal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: morichal-front
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: morichal-front
    spec:
      containers:
        - name: front
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: morichal-front
  namespace: morichal
spec:
  selector:
    app: morichal-front
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: morichal-front
  namespace: morichal
spec:
  ingressClassName: traefik
  rules:
    - host: narrativa-morichal.bardelhaus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: morichal-front
                port:
                  number: 8080
