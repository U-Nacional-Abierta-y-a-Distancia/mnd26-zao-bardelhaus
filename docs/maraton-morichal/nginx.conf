server {
    listen 8080;
    root /usr/share/nginx/html;

    # Archivos de Angular con hash en el nombre (main-AB12CD34.js): cambian de nombre en cada build,
    # así que pueden guardarse en caché un año
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imágenes, íconos y fuentes (favicon.ico, img/...): siempre se llaman igual, caché corto
    location ~* \.(?:svg|ico|png|jpe?g|webp|gif|woff2?)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Rutas de Angular: si no existe el archivo, se entrega index.html y el router decide.
    # index.html nunca se cachea, así cada despliegue se ve de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
